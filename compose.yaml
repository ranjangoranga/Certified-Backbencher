name: certified-backbenchers
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/site.sqlite3
      COOKIE_SECURE: "1"
    volumes:
      - study_data:/data
      - ./private-materials:/imports:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_HOSTNAME: ${SITE_HOSTNAME:?Set SITE_HOSTNAME in .env to your domain or a hostname pointing to this VPS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  study_data:
  caddy_data:
  caddy_config:
